#!name=ifywnx-Locket-Minimal-Test
#!desc=Chỉ thử caption. Bật đúng một phần mỗi lần.
#!author=ifywnx
# TEMPLATE: YOUR_PUBLIC_HTTPS_HOST phải là tên miền HTTPS thật.
# Không dùng raw.githubusercontent.com cho repo private.

[General]
bypass-system = true

[Rule]
FINAL,DIRECT

[Script]
# CHỈ CAPTIONS đang bật; tắt module cũ trước khi thử.
captions_test = type=http-response, pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/namespaces\/firebase:fetch(?:\?.*)?$, script-path=https://YOUR_PUBLIC_HTTPS_HOST/ifywnx-tests/captions/Locket_Captions_Test.js, requires-body=true, max-size=524288, timeout=30
# Dùng từng script riêng, không đồng thời: camera, widget, popup, diagnostics, core.
# core: https://YOUR_PUBLIC_HTTPS_HOST/ifywnx-tests/core/Locket_Core_Diagnostics.js
# widget: https://YOUR_PUBLIC_HTTPS_HOST/ifywnx-tests/widget/Locket_Widget_Test.js
# popup: https://YOUR_PUBLIC_HTTPS_HOST/ifywnx-tests/popup/Locket_Popup_Test.js
# camera: https://YOUR_PUBLIC_HTTPS_HOST/ifywnx-tests/camera/Camera_Filter_Diagnostics.js
# diagnostics: https://YOUR_PUBLIC_HTTPS_HOST/ifywnx-tests/diagnostics/Locket_Overlay_Diagnostics.js

[MITM]
hostname = firebaseremoteconfig.googleapis.com
