#!name=ifywnx-V4-Single-Test
#!desc=V4 isolated Remote Config test. Does not modify subscriptions.
#!author=ifywnx
# TEMPLATE: replace YOUR_PUBLIC_HTTPS_HOST with an authorized HTTPS host.
# Do not import with this placeholder. Repo is PRIVATE.
# Disable all other Locket rewrite modules. Run ONE test at a time.

[General]
bypass-system = true

[Rule]
FINAL,DIRECT

[Script]
# By default, only read-only core diagnostics is enabled.
v4_core = type=http-response, pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/namespaces\/firebase:fetch(?:\?.*)?$, script-path=https://YOUR_PUBLIC_HTTPS_HOST/ifywnx-v4/scripts/Locket_V4_Core.js, requires-body=true, max-size=524288, timeout=30

# To test captions/widget/camera, DISABLE v4_core and use one matching .sgmodule:
# V4_Captions_118.sgmodule
# V4_Widget_Test.sgmodule
# V4_Camera_Diagnostics.sgmodule
# V4_Popup_Test.sgmodule

[MITM]
hostname = firebaseremoteconfig.googleapis.com
