name: ANMoments
options:
  bundleIdPrefix: com.ifywnx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ANMoments:
    type: application
    platform: iOS
    sources:
      - path: ANMoments
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ifywnx.anmoments
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationDisplayName: "AN Moments"
        INFOPLIST_KEY_NSCameraUsageDescription: "AN Moments cần camera để bạn tự chụp khoảnh khắc."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "AN Moments dùng ảnh bạn chọn để lưu khoảnh khắc."
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: "NO"
